<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">连续潜空间语言模型的统一框架</title>
  <desc id="desc">上半部分是自编码器训练，下半部分是潜变量生成；两条路径在干净潜变量处汇合。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#171038"/>
    </linearGradient>
    <linearGradient id="latent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7968ff"/>
      <stop offset="1" stop-color="#36c7d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aab6e8"/>
    </marker>
    <style>
      .cn{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .title{font-size:31px;font-weight:700;fill:#f8f9ff}
      .sub{font-size:16px;fill:#aeb8df}
      .lane{font-size:18px;font-weight:700;fill:#f2f4ff}
      .box-title{font-size:19px;font-weight:700;fill:#fff}
      .box-sub{font-size:14px;fill:#d6dbf5}
      .note{font-size:14px;fill:#b9c2e8}
      .arrow{stroke:#aab6e8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <text x="54" y="58" class="cn title">统一视图：Encoder、Denoiser 和 Decoder 如何共同生成文本</text>
  <text x="54" y="87" class="cn sub">不同模型的主要区别，是由哪个模块负责让 latent 变得可生成、可解码。</text>

  <rect x="42" y="122" width="1116" height="204" rx="24" fill="#ffffff" fill-opacity=".045" stroke="#6573ad" stroke-opacity=".35"/>
  <rect x="42" y="352" width="1116" height="204" rx="24" fill="#ffffff" fill-opacity=".045" stroke="#6573ad" stroke-opacity=".35"/>
  <text x="68" y="158" class="cn lane">① 先训练 Autoencoder，得到 latent 表示</text>
  <text x="68" y="388" class="cn lane">② 再学会从噪声生成 latent</text>

  <g filter="url(#shadow)">
    <rect x="82" y="190" width="158" height="86" rx="18" fill="#e06c8b"/>
    <text x="161" y="226" text-anchor="middle" class="cn box-title">文本 token</text>
    <text x="161" y="251" text-anchor="middle" class="cn box-sub">离散、好读、难并行生成</text>

    <rect x="320" y="190" width="170" height="86" rx="18" fill="#5968d9"/>
    <text x="405" y="226" text-anchor="middle" class="cn box-title">Encoder</text>
    <text x="405" y="251" text-anchor="middle" class="cn box-sub">压长度 / 压宽度 / 塑形</text>

    <rect x="570" y="176" width="192" height="114" rx="22" fill="url(#latent)"/>
    <text x="666" y="220" text-anchor="middle" class="cn box-title">干净 latent  z₀</text>
    <text x="666" y="246" text-anchor="middle" class="cn box-sub">生成器要学它，Decoder 要读它</text>
    <text x="666" y="270" text-anchor="middle" class="cn box-sub">表示、生成与解码的共享接口</text>

    <rect x="842" y="190" width="170" height="86" rx="18" fill="#5968d9"/>
    <text x="927" y="226" text-anchor="middle" class="cn box-title">Decoder</text>
    <text x="927" y="251" text-anchor="middle" class="cn box-sub">并行 / 自回归 / Query</text>

    <rect x="1032" y="190" width="92" height="86" rx="18" fill="#e06c8b"/>
    <text x="1078" y="226" text-anchor="middle" class="cn box-title">文本</text>
    <text x="1078" y="251" text-anchor="middle" class="cn box-sub">重构</text>
  </g>
  <path d="M240 233H310" class="arrow"/>
  <path d="M490 233H560" class="arrow"/>
  <path d="M762 233H832" class="arrow"/>
  <path d="M1012 233H1022" class="arrow"/>
  <path d="M1124 290 C1124 314 1080 314 1080 290" stroke="#e7a5b8" stroke-width="2" fill="none"/>
  <text x="1060" y="314" text-anchor="end" class="cn note">CE / MSE / KL / 对齐 / 扰动恢复</text>

  <g filter="url(#shadow)">
    <rect x="84" y="422" width="158" height="86" rx="18" fill="#58637c"/>
    <text x="163" y="458" text-anchor="middle" class="cn box-title">随机噪声  ε</text>
    <text x="163" y="483" text-anchor="middle" class="cn box-sub">生成的起点</text>

    <rect x="336" y="408" width="232" height="114" rx="22" fill="#8a5bd3"/>
    <text x="452" y="450" text-anchor="middle" class="cn box-title">Denoiser / Flow</text>
    <text x="452" y="476" text-anchor="middle" class="cn box-sub">学 x、v、平均速度或 flow map</text>
    <text x="452" y="500" text-anchor="middle" class="cn box-sub">全序列 / 分块 / 一步 / 多步</text>

    <rect x="664" y="422" width="192" height="86" rx="18" fill="url(#latent)"/>
    <text x="760" y="458" text-anchor="middle" class="cn box-title">生成 latent  ẑ₀</text>
    <text x="760" y="483" text-anchor="middle" class="cn box-sub">必须落在 Decoder 会读的地方</text>

    <rect x="950" y="422" width="174" height="86" rx="18" fill="#28a6b8"/>
    <text x="1037" y="458" text-anchor="middle" class="cn box-title">冻结 Decoder</text>
    <text x="1037" y="483" text-anchor="middle" class="cn box-sub">把 latent 读成文本</text>
  </g>
  <path d="M242 465H326" class="arrow"/>
  <path d="M568 465H654" class="arrow"/>
  <path d="M856 465H940" class="arrow"/>
  <path d="M666 290V344 C666 366 760 366 760 412" class="arrow" stroke-dasharray="7 7"/>
  <text x="696" y="338" class="cn note">训练目标来自这里</text>
  <text x="56" y="590" class="cn note">统一读法：先问 latent 的信息预算和几何，再问生成顺序，最后问 Decoder 如何读回 token。</text>
</svg>
