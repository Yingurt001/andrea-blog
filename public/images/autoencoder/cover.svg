<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Autoencoder 到底在做什么</title>
  <desc id="desc">一张图像经过漏斗形的编码器，变成两个中间数字，再由解码器还原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172431"/>
      <stop offset="0.58" stop-color="#263c4e"/>
      <stop offset="1" stop-color="#6d493d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0c96d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f0c96d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e7ded1"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="890" cy="315" r="250" fill="url(#glow)"/>

  <text x="80" y="125" font-size="28" font-family="Arial, PingFang SC, sans-serif" fill="#f0c96d" letter-spacing="2">AUTOENCODER</text>
  <text x="80" y="210" font-size="58" font-weight="700" font-family="Arial, PingFang SC, sans-serif" fill="#fffdf8">到底在做什么？</text>
  <text x="82" y="266" font-size="28" font-family="Arial, PingFang SC, sans-serif" fill="#dbe3e7">从“把原图抄一遍”，读懂压缩、潜空间和 VAE</text>

  <g transform="translate(92 342)" opacity="0.88">
    <rect width="178" height="150" rx="20" fill="#f8f3e9"/>
    <path d="M21 108 L60 70 L91 96 L127 49 L157 108 Z" fill="#8ca499"/>
    <circle cx="51" cy="42" r="14" fill="#d3a765"/>
  </g>
  <path d="M295 416 H390" stroke="#e7ded1" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <path d="M420 330 H590 L548 505 H462 Z" fill="#527797"/>
    <text x="505" y="415" text-anchor="middle" font-size="25" font-weight="700" font-family="Arial, sans-serif" fill="#fff">ENCODER</text>
  </g>
  <path d="M590 416 H667" stroke="#e7ded1" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="696" y="375" width="100" height="82" rx="28" fill="#f0c96d"/>
    <circle cx="726" cy="416" r="9" fill="#74551e"/>
    <circle cx="766" cy="416" r="9" fill="#74551e"/>
  </g>
  <text x="746" y="492" text-anchor="middle" font-size="22" font-family="Arial, PingFang SC, sans-serif" fill="#f8f3e9">只留两个数</text>

  <path d="M821 416 H894" stroke="#e7ded1" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M925 330 H1095 L1053 505 H967 Z" fill="#a55f48" transform="rotate(180 1010 417.5)"/>
    <text x="1010" y="415" text-anchor="middle" font-size="25" font-weight="700" font-family="Arial, sans-serif" fill="#fff">DECODER</text>
  </g>
  <text x="1120" y="590" text-anchor="end" font-size="20" font-family="Arial, PingFang SC, sans-serif" fill="#c7d1d6">用 Fashion-MNIST 实验看懂一张“中间地图”</text>
</svg>
