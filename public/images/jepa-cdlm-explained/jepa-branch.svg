<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">JEPA 分支的 online、teacher 和 predictor</title>
  <desc id="desc">同一段文本形成受损 online view 和干净 teacher view，predictor 在 latent 空间恢复 teacher target，损失只向 online 与 predictor 反向传播。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1430"/><stop offset="1" stop-color="#1b103b"/></linearGradient>
    <linearGradient id="z" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7668ed"/><stop offset="1" stop-color="#32bfd3"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bbc5ed"/></marker>
    <marker id="grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8cac"/></marker>
    <style>.cn{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#aeb9df}.lane{font-size:20px;font-weight:700;fill:#f5f7ff}.bt{font-size:19px;font-weight:700;fill:#fff}.bs{font-size:14px;fill:#d8def7}.note{font-size:14px;fill:#bfc8ec}.tag{font-size:14px;font-weight:700;fill:#1a1730}.arr{stroke:#bbc5ed;stroke-width:3;fill:none;marker-end:url(#arr)}.grad{stroke:#ff8cac;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#grad)}</style>
  </defs>
  <rect width="1400" height="780" rx="30" fill="url(#bg)"/>
  <text x="54" y="58" class="cn title">JEPA 分支：从受损表示预测干净表示</text>
  <text x="54" y="91" class="cn sub">JEPA 不直接预测 token。它先在 latent space 中对齐，再由 Decoder 检查预测结果是否仍然可读。</text>

  <rect x="50" y="126" width="1300" height="482" rx="24" fill="#fff" fill-opacity=".045" stroke="#6573ad" stroke-opacity=".45"/>
  <rect x="82" y="188" width="178" height="74" rx="17" fill="#596681"/><text x="171" y="219" text-anchor="middle" class="cn bt">clean T5 h</text><text x="171" y="244" text-anchor="middle" class="cn bs">同一段 target</text>
  <circle cx="306" cy="225" r="7" fill="#bbc5ed"/><path d="M260 225H298" stroke="#bbc5ed" stroke-width="3"/>

  <text x="354" y="166" class="cn lane">Online path（接收 gradient）</text>
  <rect x="354" y="188" width="198" height="74" rx="17" fill="#8a557f"/><text x="453" y="219" text-anchor="middle" class="cn bt">target corruption</text><text x="453" y="244" text-anchor="middle" class="cn bs">condition 不被破坏</text>
  <rect x="610" y="188" width="204" height="74" rx="17" fill="#6659cb"/><text x="712" y="219" text-anchor="middle" class="cn bt">Online TextAE</text><text x="712" y="244" text-anchor="middle" class="cn bs">得到 z_corrupt</text>
  <rect x="872" y="188" width="226" height="74" rx="17" fill="#8b5bd2"/><text x="985" y="219" text-anchor="middle" class="cn bt">DiT t=1 Predictor</text><text x="985" y="244" text-anchor="middle" class="cn bs">得到 z_JEPA</text>
  <path d="M313 225H340" class="arr"/><path d="M552 225H596" class="arr"/><path d="M814 225H858" class="arr"/>

  <text x="354" y="348" class="cn lane">Teacher path（stop-gradient）</text>
  <rect x="354" y="370" width="198" height="74" rx="17" fill="#5d68c8"/><text x="453" y="401" text-anchor="middle" class="cn bt">clean view</text><text x="453" y="426" text-anchor="middle" class="cn bs">不做 corruption</text>
  <rect x="610" y="370" width="204" height="74" rx="17" fill="#68588e"/><text x="712" y="401" text-anchor="middle" class="cn bt">EMA compressor</text><text x="712" y="426" text-anchor="middle" class="cn bs">不通过 loss 更新</text>
  <rect x="872" y="370" width="226" height="74" rx="17" fill="url(#z)"/><text x="985" y="401" text-anchor="middle" class="cn bt">clean target z*</text><text x="985" y="426" text-anchor="middle" class="cn bs">detach 后作为监督</text>
  <path d="M306 232V407H340" class="arr"/><path d="M552 407H596" class="arr"/><path d="M814 407H858" class="arr"/>

  <rect x="1148" y="258" width="162" height="116" rx="20" fill="#df6c8c"/><text x="1229" y="295" text-anchor="middle" class="cn bt">JEPA loss</text><text x="1229" y="325" text-anchor="middle" class="cn bs">MSE(z_JEPA,</text><text x="1229" y="347" text-anchor="middle" class="cn bs">stopgrad(z*))</text>
  <path d="M1098 225 C1134 225 1138 282 1140 300" class="arr"/><path d="M1098 407 C1134 407 1138 350 1140 332" class="arr"/>

  <path d="M1148 300 C1118 158 1030 151 985 178" class="grad"/>
  <path d="M872 274 H824" class="grad"/>
  <text x="844" y="537" class="cn note">gradient 只回到 Predictor 和 Online TextAE</text>
  <rect x="908" y="473" width="258" height="32" rx="16" fill="#ffb4c0"/><text x="1037" y="495" text-anchor="middle" class="cn tag">不会沿 teacher path 反向传播</text>

  <rect x="50" y="634" width="1300" height="96" rx="22" fill="#fff" fill-opacity=".055" stroke="#6573ad" stroke-opacity=".35"/>
  <text x="76" y="670" class="cn bt">EMA 更新不是 backpropagation</text>
  <text x="76" y="704" class="cn sub">每次 optimizer step 后：θ_teacher ← τθ_teacher + (1−τ)θ_online。teacher 提供变化较慢的 target。</text>
</svg>
