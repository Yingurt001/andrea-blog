<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">JEPA-CDLM 完整训练架构</title>
  <desc id="desc">冻结 T5 的特征分别进入 online TextAE 和 EMA compressor，JEPA、Flow、feature MSE 与 token CE 共同训练模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1430"/><stop offset="1" stop-color="#1b103b"/></linearGradient>
    <linearGradient id="z" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7668ed"/><stop offset="1" stop-color="#32bfd3"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9c4ed"/></marker>
    <marker id="pinkarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f58cac"/></marker>
    <style>.cn{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#aeb9df}.lane{font-size:20px;font-weight:700;fill:#f5f7ff}.bt{font-size:18px;font-weight:700;fill:#fff}.bs{font-size:14px;fill:#d8def7}.note{font-size:14px;fill:#bfc8ec}.tag{font-size:14px;font-weight:700;fill:#1a1730}.arr{stroke:#b9c4ed;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 7}.loss{stroke:#f58cac;stroke-width:3;fill:none;marker-end:url(#pinkarr)}</style>
  </defs>
  <rect width="1400" height="980" rx="30" fill="url(#bg)"/>
  <text x="54" y="58" class="cn title">JEPA-CDLM 训练时同时运行三条路径</text>
  <text x="54" y="91" class="cn sub">三条路径共享 clean target latent z*；只有 online 网络和共享 DiT 接收梯度，EMA compressor 通过参数滑动平均更新。</text>

  <rect x="50" y="124" width="1300" height="160" rx="24" fill="#fff" fill-opacity=".045" stroke="#6573ad" stroke-opacity=".45"/>
  <text x="74" y="160" class="cn lane">公共输入：token 先变成 T5 contextual features</text>
  <rect x="92" y="184" width="190" height="68" rx="16" fill="#596681"/><text x="187" y="212" text-anchor="middle" class="cn bt">token ids</text><text x="187" y="235" text-anchor="middle" class="cn bs">[B, 128]</text>
  <rect x="376" y="176" width="236" height="84" rx="17" fill="#596681"/><text x="494" y="208" text-anchor="middle" class="cn bt">冻结 T5-small</text><text x="494" y="234" text-anchor="middle" class="cn bs">[B,128] → [B,128,512]</text>
  <rect x="706" y="176" width="260" height="84" rx="17" fill="#5d68c8"/><text x="836" y="208" text-anchor="middle" class="cn bt">clean T5 features h</text><text x="836" y="234" text-anchor="middle" class="cn bs">condition / target mask 已确定</text>
  <path d="M282 218H362" class="arr"/><path d="M612 218H692" class="arr"/>

  <rect x="50" y="308" width="1300" height="220" rx="24" fill="#fff" fill-opacity=".045" stroke="#6573ad" stroke-opacity=".45"/>
  <text x="74" y="344" class="cn lane">路径 A：JEPA + readout，学习从受损 target 表示恢复 clean latent</text>
  <rect x="86" y="376" width="208" height="92" rx="17" fill="#8a557f"/><text x="190" y="408" text-anchor="middle" class="cn bt">target corruption</text><text x="190" y="433" text-anchor="middle" class="cn bs">noise / zero / mask</text><text x="190" y="454" text-anchor="middle" class="cn bs">condition 保持 clean</text>
  <rect x="352" y="376" width="216" height="92" rx="17" fill="#6659cb"/><text x="460" y="408" text-anchor="middle" class="cn bt">Online TextAE</text><text x="460" y="433" text-anchor="middle" class="cn bs">4× length compression</text><text x="460" y="454" text-anchor="middle" class="cn bs">z_corrupt [B,S,Dz]</text>
  <rect x="626" y="376" width="232" height="92" rx="17" fill="#8b5bd2"/><text x="742" y="408" text-anchor="middle" class="cn bt">共享 DiT · t=1</text><text x="742" y="433" text-anchor="middle" class="cn bs">decode final head</text><text x="742" y="454" text-anchor="middle" class="cn bs">预测 z_JEPA</text>
  <rect x="916" y="376" width="202" height="92" rx="17" fill="#aa527b"/><text x="1017" y="408" text-anchor="middle" class="cn bt">TextAE Decoder</text><text x="1017" y="433" text-anchor="middle" class="cn bs">恢复 128×512 features</text><text x="1017" y="454" text-anchor="middle" class="cn bs">并行 unembed</text>
  <rect x="1176" y="376" width="132" height="92" rx="17" fill="#df6c8c"/><text x="1242" y="410" text-anchor="middle" class="cn bt">token</text><text x="1242" y="438" text-anchor="middle" class="cn bs">target CE</text>
  <path d="M294 422H338" class="arr"/><path d="M568 422H612" class="arr"/><path d="M858 422H902" class="arr"/><path d="M1118 422H1162" class="arr"/>
  <rect x="612" y="480" width="260" height="30" rx="15" fill="#ffb4c0"/><text x="742" y="501" text-anchor="middle" class="cn tag">JEPA MSE：z_JEPA 对齐 stop-grad z*</text>
  <text x="928" y="499" class="cn note">feature MSE + token CE</text>

  <rect x="50" y="552" width="1300" height="164" rx="24" fill="#fff" fill-opacity=".045" stroke="#6573ad" stroke-opacity=".45"/>
  <text x="74" y="588" class="cn lane">路径 B：EMA teacher，生成稳定的 clean target endpoint</text>
  <rect x="212" y="614" width="250" height="72" rx="17" fill="#68588e"/><text x="337" y="644" text-anchor="middle" class="cn bt">EMA compressor</text><text x="337" y="669" text-anchor="middle" class="cn bs">读取 clean h；不接收 gradient</text>
  <rect x="568" y="614" width="238" height="72" rx="17" fill="url(#z)"/><text x="687" y="644" text-anchor="middle" class="cn bt">z* clean target</text><text x="687" y="669" text-anchor="middle" class="cn bs">JEPA 与 Flow 的监督目标</text>
  <path d="M462 650H554" class="arr"/>
  <path d="M687 614V548 C687 530 742 530 742 516" class="loss dash"/>
  <text x="834" y="653" class="cn note">θ_teacher ← τθ_teacher + (1−τ)θ_online</text>

  <rect x="50" y="740" width="1300" height="176" rx="24" fill="#fff" fill-opacity=".045" stroke="#6573ad" stroke-opacity=".45"/>
  <text x="74" y="776" class="cn lane">路径 C：Flow Matching，学习从 Gaussian noise 到达同一个 z*</text>
  <rect x="104" y="812" width="182" height="70" rx="17" fill="#596681"/><text x="195" y="842" text-anchor="middle" class="cn bt">Gaussian ε</text><text x="195" y="866" text-anchor="middle" class="cn bs">t=0</text>
  <rect x="362" y="812" width="232" height="70" rx="17" fill="#367fa8"/><text x="478" y="842" text-anchor="middle" class="cn bt">z_t=(1−t)ε+t z*</text><text x="478" y="866" text-anchor="middle" class="cn bs">随机采样时间 t</text>
  <rect x="670" y="812" width="242" height="70" rx="17" fill="#367fa8"/><text x="791" y="842" text-anchor="middle" class="cn bt">共享 DiT · Flow head</text><text x="791" y="866" text-anchor="middle" class="cn bs">预测 clean endpoint / velocity</text>
  <rect x="988" y="812" width="236" height="70" rx="17" fill="url(#z)"/><text x="1106" y="842" text-anchor="middle" class="cn bt">Flow prediction</text><text x="1106" y="866" text-anchor="middle" class="cn bs">Flow loss 对齐 z*</text>
  <path d="M286 847H348" class="arr"/><path d="M594 847H656" class="arr"/><path d="M912 847H974" class="arr"/>

  <text x="54" y="951" class="cn note">默认总目标：L = L_CE + L_feature + L_JEPA + L_Flow + 0.1 L_SigReg。具体开关和权重以实验配置为准。</text>
</svg>
